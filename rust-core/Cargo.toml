[package]
name = "glasis-rust-core"
version = "5.0.0"
edition = "2021"
description = "GlassiumOS 5 Hybrid Rust/Wasm Core Engine for 3D Weather Physics, 10-Band Biquad EQ DSP, and Acoustic Analysis"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
